<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>CRUD Aman Tanpa Key Leak</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    form { display: flex; gap: 10px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
  </style>
</head>
<body>

  <h2>Input Data Laporan</h2>

  <!-- Form Tambah Data -->
  <form id="formInput">
    <input type="text" id="nama" placeholder="Nama" required>
    <input type="text" id="keterangan" placeholder="Keterangan" required>
    <button type="submit">Simpan</button>
  </form>

  <!-- Tabel Data -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nama</th>
        <th>Keterangan</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="tabelBody">
      <tr><td colspan="4">Memuat data...</td></tr>
    </tbody>
  </table>

  <script>
    const API_URL = '/api/crud';

    // READ: Tampilkan Data saat web dibuka
    async function loadData() {
      const res = await fetch(API_URL);
      const data = await res.json();
      const tbody = document.getElementById('tabelBody');

      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">Belum ada data.</td></tr>';
        return;
      }

      data.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td>${item.id}</td>
            <td>${item.nama}</td>
            <td>${item.keterangan}</td>
            <td><button onclick="hapusData('${item.id}')">Hapus</button></td>
          </tr>
        `;
      });
    }

    // CREATE: Simpan Data Baru
    document.getElementById('formInput').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = document.getElementById('nama').value;
      const keterangan = document.getElementById('keterangan').value;

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nama, keterangan })
      });

      document.getElementById('formInput').reset();
      loadData();
    });

    // DELETE: Hapus Data
    async function hapusData(id) {
      if (confirm('Hapus data ini?')) {
        await fetch(API_URL, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        loadData();
      }
    }

    // Jalankan pertama kali
    loadData();
  </script>
</body>
</html>
